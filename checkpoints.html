<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Checkpoints | App Factory</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#10131b;
  color:#f3f4f8;
  font-family:Arial,sans-serif
}
header{
  padding:16px;
  background:#191e29;
  border-bottom:1px solid #303746
}
.brand{
  color:#d9a85b;
  font-weight:800;
  font-size:20px
}
main{
  padding:18px;
  max-width:900px;
  margin:auto
}
.muted{
  color:#929bad;
  font-size:13px
}
button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  background:#c18d43;
  color:#171717;
  font-weight:bold;
  cursor:pointer
}
.secondary{
  background:#303746;
  color:white
}
.danger{
  background:#793341;
  color:white
}
.card{
  background:#191e29;
  border:1px solid #303746;
  border-radius:10px;
  padding:15px;
  margin-top:14px
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}
#status{
  margin-top:14px;
  color:#9acb9a;
  font-size:13px
}
</style>
</head>

<body>

<header>
  <div class="brand">⚙ APP FACTORY</div>
  <div class="muted">Project Checkpoint History</div>
</header>

<main>
  <button class="secondary" onclick="goBack()">← Workspace</button>

  <h2 id="projectTitle">Loading project...</h2>
  <p class="muted">Saved snapshots of your complete project.</p>

  <div id="checkpointList"></div>
  <div id="status">Ready</div>
</main>

<script>
const PROJECTS_KEY="app_factory_projects";
const FILES_KEY="app_factory_files";
const CHECKPOINTS_KEY="app_factory_checkpoints";

const params=new URLSearchParams(location.search);
const projectId=Number(params.get("id"));

function readData(key){
  try{
    return JSON.parse(localStorage.getItem(key))||{};
  }catch(e){
    return {};
  }
}

function goBack(){
  location.href="project.html?id="+projectId;
}

function init(){
  const projects=JSON.parse(
    localStorage.getItem(PROJECTS_KEY)||"[]"
  );

  const project=projects.find(p=>p.id===projectId);

  if(!project){
    document.getElementById("projectTitle").textContent="Project not found";
    return;
  }

  document.getElementById("projectTitle").textContent=project.name;
  renderCheckpoints();
}

function renderCheckpoints(){
  const list=document.getElementById("checkpointList");
  const all=readData(CHECKPOINTS_KEY);
  const checkpoints=all[projectId]||[];

  list.innerHTML="";

  if(checkpoints.length===0){
    list.innerHTML='<div class="card">No checkpoints saved yet.</div>';
    return;
  }

  checkpoints.forEach((checkpoint,index)=>{
    const card=document.createElement("div");
    card.className="card";

    const heading=document.createElement("strong");
    heading.textContent="Checkpoint "+(index+1);

    const date=document.createElement("p");
    date.className="muted";
    date.textContent=checkpoint.date||"Unknown date";

    const count=document.createElement("p");
    count.className="muted";
    count.textContent=
      Object.keys(checkpoint.files||{}).length+" project entries";

    const actions=document.createElement("div");
    actions.className="actions";

    const restore=document.createElement("button");
    restore.textContent="Restore";
    restore.onclick=()=>restoreCheckpoint(checkpoint);

    const remove=document.createElement("button");
    remove.className="danger";
    remove.textContent="Delete";
    remove.onclick=()=>deleteCheckpoint(checkpoint.id);

    actions.appendChild(restore);
    actions.appendChild(remove);

    card.appendChild(heading);
    card.appendChild(date);
    card.appendChild(count);
    card.appendChild(actions);

    list.appendChild(card);
  });
}

function restoreCheckpoint(checkpoint){
  if(!confirm(
    "Restore this checkpoint? Your current project files will be replaced."
  ))return;

  const files=checkpoint.files;

  if(!files || typeof files!=="object"){
    setStatus("Invalid checkpoint.");
    return;
  }

  const allFiles=readData(FILES_KEY);
  allFiles[projectId]=JSON.parse(JSON.stringify(files));

  localStorage.setItem(FILES_KEY,JSON.stringify(allFiles));

  setStatus("Checkpoint restored successfully.");
}

function deleteCheckpoint(id){
  if(!confirm("Delete this checkpoint permanently?"))return;

  const all=readData(CHECKPOINTS_KEY);
  all[projectId]=(all[projectId]||[]).filter(
    checkpoint=>checkpoint.id!==id
  );

  localStorage.setItem(CHECKPOINTS_KEY,JSON.stringify(all));

  renderCheckpoints();
  setStatus("Checkpoint deleted.");
}

function setStatus(message){
  document.getElementById("status").textContent=message;
}

init();
</script>

</body>
</html>
